name: Deploy Pages

# Publishes the XENO design-system showcase (index.html + tokens + fonts) to
# GitHub Pages. One-time: Settings → Pages → Source → "GitHub Actions".
# Live at: https://jondridev.github.io/design-system/

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧹 Stage site (exclude VCS / CI)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-create the Pages site (Actions source) on first run, so no
          # manual Settings → Pages step is needed. Needs a public repo on the
          # Free plan, or any repo on Pro/Team.
          enablement: true

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
